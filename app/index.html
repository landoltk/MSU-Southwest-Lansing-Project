<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.css" rel="stylesheet"/>

    <title>SWLP Prototype Map</title>
    <link rel="stylesheet" href="static/style.css" />
</head>
<body>
    <h1>SWLP Prototype</h1>
    <div id="map" style="width:100%;height:100vh"></div>
    <div id="bg-panel" style="position:absolute;bottom:12px;left:12px;z-index:1;background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:10px;min-width:220px;max-height:40vh;overflow:auto;font:14px system-ui">
        <div style="display:flex;gap:8px;align-items:center;justify-content:space-between">
            <div style="font-weight:600">Selected BGs</div>
            <button id="bg-clear" style="padding:4px 8px;border:1px solid #e5e7eb;border-radius:6px;background:#f9fafb;cursor:pointer">Clear</button>
            <button id="bg-submit" style="padding:4px 8px;border:1px solid #e5e7eb;border-radius:6px;background:#eef2ff;cursor:pointer">Submit</button>
        </div>
        <ul id="bg-list" style="margin:8px 0 0 0;padding:0;list-style:none"></ul>
    </div>
    <!--MapLibre Section-->
    <script src="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.js"></script>
    <script src="map.js"></script>
</body>
</html>
